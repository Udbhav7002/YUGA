<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CodeGhost — Operations</title>
<style>
  :root {
    --bg: #f5f2ea; --ink: #16150f; --muted: #6f6a5e; --faint: #9a9484;
    --hair: #dcd7c9; --dash: #b8b19e; --red: #c92a2a; --paper: #fbfaf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--bg); color: var(--ink); padding: 40px 24px 80px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: 2px; color: var(--red); font-weight: 600; }
  .eyebrow::before { content: '● '; font-size: 9px; vertical-align: 1px; }
  header h1 { font-size: 40px; letter-spacing: 2px; margin: 6px 0 2px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .rule { border-top: 3px solid var(--ink); margin: 18px 0 0; }
  .headrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .env { text-align: right; font-size: 11px; color: var(--muted); }
  .env b { color: var(--ink); display: block; margin-top: 2px; }

  .controls { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
  button.run { font: inherit; font-size: 11px; letter-spacing: 1px; font-weight: 600;
    background: var(--ink); color: var(--bg); border: 1.5px solid var(--ink);
    padding: 11px 22px; cursor: pointer; transition: all .15s; }
  button.run:hover:not(:disabled) { background: var(--red); border-color: var(--red); }
  button.run:disabled { opacity: .5; cursor: wait; }
  .timer { font-size: 12px; color: var(--muted); }
  .timer b { color: var(--red); font-size: 15px; }

  table { width: 100%; border-collapse: collapse; background: var(--paper);
    border: 1px dashed var(--dash); }
  tr { border-bottom: 1px solid var(--hair); transition: background .2s; }
  tr:last-child { border-bottom: none; }
  td { padding: 12px 16px; vertical-align: middle; }
  td.stage { width: 280px; display: flex; align-items: center; gap: 11px; }
  .mark { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--paper); flex-shrink: 0; transition: all .2s; }
  td.stage .lbl { font-weight: 600; color: var(--muted); font-size: 12.5px; }
  td.desc { color: var(--faint); font-size: 11.5px; }
  td.dur { width: 80px; text-align: right; font-variant-numeric: tabular-nums; color: var(--faint); font-size: 12px; }
  tr.done .mark { background: var(--ink); border-color: var(--ink); }
  tr.done .lbl { color: var(--ink); }
  tr.done .dur { color: var(--ink); font-weight: 600; }
  tr.active { background: #f0ece1; }
  tr.active .mark { border-color: var(--red); animation: blink 1.1s ease-in-out infinite; }
  tr.active .lbl, tr.active .dur { color: var(--red); }
  @keyframes blink { 0%,100% { background: transparent; } 50% { background: var(--red); } }

  .summary { display: none; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .summary.show { display: grid; }
  .card { border: 1px dashed var(--dash); background: var(--paper); padding: 12px 16px; }
  .card .k { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); }
  .card .v { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pill.ok { color: var(--ink); } .pill.ok i { background: var(--ink); }
  .pill.warn, .pill.bad { color: var(--red); } .pill.warn i, .pill.bad i { background: var(--red); }

  .verdict { display: none; margin-top: 16px; border: 1.5px dashed var(--dash);
    background: var(--paper); padding: 14px 18px; font-size: 12px; }
  .verdict.show { display: block; }
  .verdict .headline { font-weight: 700; margin-bottom: 4px; }
  .verdict.ok .headline { color: var(--ink); }
  .verdict.warn .headline, .verdict.bad .headline { color: var(--red); }
  .verdict .note { color: var(--muted); font-size: 11.5px; }
  .pr { display: none; margin-top: 14px; text-align: center; }
  .pr a { display: inline-block; font-size: 11px; letter-spacing: 1px; font-weight: 600;
    color: var(--red); border: 1.5px solid var(--red); padding: 10px 24px;
    text-decoration: none; background: var(--paper); transition: all .15s; }
  .pr a:hover { background: var(--red); color: var(--bg); }
  .pr.show { display: block; }
  .hint { color: var(--faint); font-size: 11px; text-align: center; min-height: 16px; margin-top: 10px; }

  section.jobs { margin-top: 36px; }
  section.jobs h2 { font-size: 10.5px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .jrow { display: flex; gap: 14px; align-items: center; padding: 9px 14px;
    border: 1px dashed var(--hair); background: var(--paper); margin-bottom: 6px; font-size: 11.5px; }
  .jrow .jid { color: var(--faint); }
  .jrow .route { flex: 1; color: var(--ink); font-size: 11.5px; }
  .jrow a { color: var(--red); text-decoration: none; font-weight: 600; }
</style>
<body><div class="wrap">
  <div class="headrow">
    <div>
      <div class="eyebrow">OPERATIONS · AUTONOMOUS CRASH-TO-FIX PIPELINE</div>
      <h1>CODEGHOST</h1>
      <div class="sub">production crash in → verified fix + pull request out</div>
    </div>
    <div class="env">target <b id="envTarget">—</b>repo <b>github.com/Udbhav7002/YUGA_testing</b><a href="/login" style="color:var(--red);text-decoration:none;font-weight:600">SIGN IN →</a></div>
  </div>
  <div class="rule"></div>

  <div class="controls">
    <button class="run" id="triggerBtn" onclick="triggerCrash()">RUN DEMO — TRIGGER CRASH</button>
    <div class="timer" id="timer"></div>
  </div>

  <table id="pipeline"></table>

  <div class="summary" id="summary">
    <div class="card"><div class="k">TOTAL TIME</div><div class="v" id="mTotal">—</div></div>
    <div class="card"><div class="k">VERIFICATION</div><div class="v" id="mVerified">—</div></div>
    <div class="card"><div class="k">FIX ATTEMPTS</div><div class="v" id="mRetries">—</div></div>
  </div>

  <div class="verdict" id="verdict"></div>
  <div class="pr" id="prLink"></div>
  <p class="hint" id="hint"></p>

  <section class="jobs">
    <h2>JOB HISTORY</h2>
    <div id="jobList"></div>
  </section>
</div>

<script>
const TARGET_APP = (() => {
  const portMap = { '8002': '8001', '8004': '8003', '8006': '8005', '8008': '8007', '9000': '8000' };
  return `http://${location.hostname}:${portMap[location.port] || '8001'}`;
})();
document.getElementById('envTarget').textContent = `${location.hostname}:${(TARGET_APP.split(':'))[2]}`;

const DEMO_CRASH = {
  '8002': ['POST', '/calculate', { a: 10, b: 0, operation: 'divide' }],
  '8004': ['GET', '/rooms/huddle-0/occupancy', null],
  '8006': ['POST', '/calculate', { a: 10, b: 0, operation: 'divide' }],
  '8008': ['GET', '/profile/999', null],
};

const ROWS = [
  { stage: 'received',             name: 'Crash intercepted',   desc: 'middleware caught the 500 · HMAC-signed report', keys: [] },
  { stage: 'reading_source',       name: 'Reading source',      desc: 'repository loaded into memory',                  keys: ['read_source'] },
  { stage: 'generating_test',      name: 'Generating test',     desc: 'LLM writes a reproduction test',                 keys: ['llm_test'] },
  { stage: 'running_failing_test', name: 'Sandbox — red run',   desc: 'crash must reproduce in isolation',              keys: ['sandbox_red'] },
  { stage: 'generating_fix',       name: 'Generating fix',      desc: 'LLM patches the file · blocklist scanned',       keys: ['llm_fix'] },
  { stage: 'verifying_fix',        name: 'Sandbox — green run', desc: 'same test must pass with the fix',               keys: ['sandbox_green'] },
  { stage: 'opening_pr',           name: 'Opening pull request',desc: 'fix + regression test committed',                keys: ['github'] },
];

let lastJob = null, t0 = null, triggerAt = null, timerHandle = null;

function render(job) {
  const cur = ROWS.findIndex(r => r.stage === job.stage);
  document.getElementById('pipeline').innerHTML = ROWS.map((r, i) => {
    const matched = r.keys.flatMap(k => Object.keys(job.steps || {}).filter(s => s.startsWith(k)));
    const t = matched.reduce((a, s) => a + (job.steps[s] || 0), 0);
    let cls = '', mark = '';
    if (job.final) { if (i === 0 || matched.length) { cls = 'done'; mark = '✓'; } }
    else if (i < cur) { cls = 'done'; mark = '✓'; }
    else if (i === cur) { cls = 'active'; }
    let desc = r.desc;
    if (r.stage === 'generating_fix' && Object.keys(job.steps || {}).filter(s => s.startsWith('llm_fix')).length > 1)
      desc = `attempt ${Object.keys(job.steps).filter(s => s.startsWith('llm_fix')).length} · sandbox feedback loop`;
    const dur = matched.length ? t.toFixed(1) + 's' : (cls === 'active' ? '···' : '—');
    return `<tr class="${cls}"><td class="stage"><span class="mark">${mark}</span><span class="lbl">${r.name}</span></td><td class="desc">${desc}</td><td class="dur">${dur}</td></tr>`;
  }).join('');
}

function finish(job) {
  clearInterval(timerHandle);
  render(job);
  const s = document.getElementById('summary'), v = document.getElementById('verdict'), pr = document.getElementById('prLink');
  s.classList.add('show');
  document.getElementById('mTotal').textContent = job.elapsed ? job.elapsed + 's' : '—';
  document.getElementById('mRetries').textContent = job.retries ?? 0;
  const mv = document.getElementById('mVerified');
  v.classList.add('show');
  v.className = 'verdict show';
  pr.className = 'pr';
  if (job.status === 'fixed') {
    mv.innerHTML = '<span class="pill ok"><i></i>verified</span>';
    v.classList.add('ok');
    v.innerHTML = '<div class="headline">Fix verified in sandbox — regression test failed before, passed after.</div><div class="note">The PR contains both runs raw. Merge is one click; a human approves.</div>'
      + (job.commit_sha ? `<div class="note">commit <b>${job.commit_sha.slice(0, 7)}</b> on <b>${job.branch || 'codeghost/agent-fixes'}</b></div>` : '');
    if (job.pr_url) { pr.classList.add('show'); pr.innerHTML = `<a href="${job.pr_url}" target="_blank">VIEW PULL REQUEST →</a>`; }
  } else if (job.status === 'draft_pr') {
    mv.innerHTML = '<span class="pill warn"><i></i>unverified</span>';
    v.classList.add('warn');
    v.innerHTML = '<div class="headline">Opened as draft — the fix did not pass verification.</div><div class="note">CodeGhost refuses to claim success it cannot prove. A human reviews.</div>';
    if (job.pr_url) { pr.classList.add('show'); pr.innerHTML = `<a href="${job.pr_url}" target="_blank">VIEW DRAFT PULL REQUEST →</a>`; }
  } else {
    mv.innerHTML = '<span class="pill bad"><i></i>stopped</span>';
    v.classList.add('bad');
    v.innerHTML = `<div class="headline">${job.status === 'failed' ? 'Pipeline stopped — ' + (job.reason || 'crash not reproducible') : 'Error — ' + (job.error || 'unknown')}</div><div class="note">No unverified changes were pushed.</div>`;
  }
  document.getElementById('triggerBtn').disabled = false;
  document.getElementById('triggerBtn').textContent = 'RUN DEMO — TRIGGER CRASH';
  document.getElementById('timer').textContent = job.elapsed ? `total ${job.elapsed}s` : '';
}

function tick() {
  fetch('/status/last').then(r => r.json()).then(job => {
    if (!job.crash_id) {
      const pl = document.getElementById('pipeline');
      if (!pl.innerHTML) pl.innerHTML = '<tr><td class="stage"><span class="lbl" style="color:var(--faint)">Waiting for a crash…</span></td><td class="desc">click “Run demo” — or send real traffic to the target app</td><td class="dur">—</td></tr>';
      return;
    }
    if (job.job_id !== lastJob) {
      lastJob = job.job_id; t0 = Date.now();
      ['summary', 'verdict', 'prLink'].forEach(id => document.getElementById(id).classList.remove('show'));
      document.getElementById('hint').textContent = '';
    }
    const final = ['fixed', 'draft_pr', 'failed', 'error'].includes(job.status);
    job.final = final;
    if (final) finish(job);
    else {
      render(job);
      if (t0) document.getElementById('timer').innerHTML = `elapsed <b>${((Date.now() - t0) / 1000).toFixed(1)}s</b>`;
      if (triggerAt && Date.now() - triggerAt > 10000 && job.stage === 'received')
        document.getElementById('hint').textContent = 'No new job — the same crash inside 5 minutes is deduplicated (cooldown). Restart the orchestrator or present the other bug.';
    }
  }).catch(() => {});
}

function triggerCrash() {
  const btn = document.getElementById('triggerBtn');
  btn.disabled = true; btn.textContent = 'CRASHING TARGET…';
  triggerAt = Date.now();
  const [method, path, body] = DEMO_CRASH[location.port] || DEMO_CRASH['8002'];
  const opts = { method };
  if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  fetch(`${TARGET_APP}${path}`, opts).catch(() => {
    document.getElementById('hint').textContent = `Target app unreachable at ${TARGET_APP}`;
    btn.disabled = false; btn.textContent = 'RUN DEMO — TRIGGER CRASH';
  });
}

async function tickJobs() {
  try {
    const jobs = (await (await fetch('/jobs')).json()).slice(-6).reverse();
    document.getElementById('jobList').innerHTML = jobs.map(j =>
      `<div class="jrow"><span class="jid">${j.job_id}</span><span class="route">${j.route || ''}</span>
       <span class="pill ${j.status === 'fixed' ? 'ok' : j.status === 'draft_pr' ? 'warn' : 'bad'}"><i></i>${j.status}</span>
       ${j.pr_url ? `<a href="${j.pr_url}" target="_blank">PR →</a>` : ''}</div>`).join('');
  } catch (e) {}
}

setInterval(tick, 600);
setInterval(tickJobs, 3000);
tick(); tickJobs();
</script>
</body></html>
